[alembic]
script_location = warn_v2/db/migrations
prepend_sys_path = .
# Filename = date + Alembic's auto-generated (random) revision id + slug. The
# %(rev)s guarantees uniqueness so two branches authored the same day can't
# collide on a filename — and revision IDs must never be hand-assigned (the
# old manual NNNN + incremented-hex scheme produced duplicate ids → a dual
# Alembic head that broke a prod deploy). See warn_v2/db/migrations/README.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url = ${DATABASE_URL}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
