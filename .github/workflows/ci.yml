name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: homelab-warn-v2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Alembic single head
        # Fails the PR if the migrations form more than one head (parallel
        # branches) or contain a duplicate revision id (alembic errors on load).
        # Catches the collision class that once wedged a prod deploy, before merge.
        # Reads scripts only — no DB needed; sqlite:// just satisfies env.py.
        env:
          DATABASE_URL: "sqlite://"
        run: |
          heads="$(uv run alembic heads)"
          echo "$heads"
          n="$(printf '%s\n' "$heads" | grep -c '(head)')"
          if [ "$n" -ne 1 ]; then
            echo "::error::Expected exactly 1 Alembic head, found $n. Run 'alembic merge heads' or re-point your migration's down_revision."
            exit 1
          fi
      - name: Test
        run: uv run python -m pytest -v

  frontend:
    runs-on: homelab-warn-v2
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          # Enable npm cache only when a lockfile is committed; setup-node errors
          # hard if cache-dependency-path points at a missing file.
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Type-check + build
        run: npm run build
