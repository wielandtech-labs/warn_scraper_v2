name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: homelab-dind
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx (remote buildkitd)
      uses: docker/setup-buildx-action@v4
      with:
        driver: remote
        endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
        driver-opts: |
          cacert=/etc/buildkit/certs/ca.crt
          cert=/etc/buildkit/certs/tls.crt
          key=/etc/buildkit/certs/tls.key

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set version vars
      id: vars
      run: |
        DATE=$(date +'%Y%m%d')
        TIME=$(date +'%H%M%S')
        SHA=$(git rev-parse --short HEAD)
        echo "date=$DATE" >> $GITHUB_OUTPUT
        echo "time=$TIME" >> $GITHUB_OUTPUT
        echo "sha=$SHA" >> $GITHUB_OUTPUT

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/wielandtech-labs/warn-v2
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.time }}-${{ steps.vars.outputs.sha }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Remote buildkitd handles its own layer + cache-mount persistence via
        # the PVC. No gha cache needed.
        cache-to: type=inline
