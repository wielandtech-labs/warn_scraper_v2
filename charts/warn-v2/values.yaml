# Default values for the warn-v2 chart.
# Override in the homelab w_homelab repo's HelmRelease.

image:
  repository: ghcr.io/wielandtech-labs/warn-v2
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Postgres connection. The cluster itself is the shared CNPG postgres-cluster
# in the database namespace (see w_homelab/clusters/prod/databases/).
database:
  # SealedSecret name producing DATABASE_URL
  secretName: warn-v2-db
  secretKey: url

# Anthropic API key for self-heal + enrichment agents.
anthropic:
  secretName: warn-v2-anthropic
  secretKey: api-key

github:
  # GITHUB_TOKEN with `repo` + `workflow` scopes for the self-heal PR opener.
  secretName: warn-v2-github
  secretKey: token

snapshotStorage:
  # NFS PVC for raw scrape snapshots (replay material for self-heal).
  storageClass: nfs-client
  size: 10Gi

scraper:
  schedule: "17 7 * * *"  # daily 07:17 local — off the :00 + :30 herd
  # States whose failure should NOT fail the nightly Job (known-blocked or
  # chronically-flaky sources). They are still scraped and their scraper_runs
  # row still records the failure; they just don't flip the exit code, so one
  # flaky source doesn't mark every Job Failed and churn CronJob/pod-log history.
  # Sustained outages are caught by alerting off scraper_runs, not the exit code.
  tolerateFailures: "GA"  # GA: Playwright source is timeout-prone
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

enricher:
  enabled: true  # override to false in HelmRelease until Phase 4 is ready
  schedule: "23 */6 * * *"  # every 6h
  limit: 10       # max companies to enrich per CronJob run
  recentYears: 2  # only enrich companies with notices in the last N years
  # D&B Hoovers provider (private, derived image). When providerImage is set, the
  # enricher runs that image instead of the public app image, with the Hoovers
  # credentials + a warm-session PVC. Leave blank to run the cascade without the
  # provider tier (EDGAR + Claude only).
  providerImage: ""   # e.g. ghcr.io/wielandtech-labs/warn-enrich-dnb:<tag>
  providerModule: ""  # override ENRICHMENT_PROVIDER_MODULE (baked into the image ENV by default)
  imagePullSecrets: []  # e.g. [{ name: ghcr-wielandtech-labs }] for the private image
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# D&B Hoovers seat credentials (only used when enricher.providerImage is set).
dnb:
  secretName: warn-v2-dnb   # SealedSecret with username + password keys
  usernameKey: username
  passwordKey: password

# Persistent warm-session profile for the Hoovers provider. Strongly recommended
# in prod so the authenticated session survives between runs (re-login every run
# raises reCAPTCHA risk). Requires enricher.providerImage to be set.
hooversStorage:
  enabled: false
  storageClass: nfs-client
  size: 1Gi

api:
  enabled: true
  replicas: 1
  service:
    port: 8000
  ingress:
    enabled: false   # flip on in HelmRelease to expose externally
    className: traefik
    host: warn.lab.wielandtech.com
    tls: true        # provisions a cert-manager Certificate when annotations include cluster-issuer
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

serviceMonitor:
  enabled: true   # picked up by your existing Prometheus
  interval: 30s

pdfStorage:
  enabled: false        # flip on in HelmRelease; requires a PVC-capable storage class
  storageClass: nfs-client
  size: 20Gi

pdfDownloader:
  enabled: false        # flip on in HelmRelease after pdfStorage is enabled
  schedule: "0 9 * * *" # daily 09:00, ~2h after the scraper
  limit: 500
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

geoBackfill:
  enabled: false       # flip on in HelmRelease; runs nightly to fill NULL coordinates
  schedule: "47 8 * * *"  # daily ~1.5h after the scraper; weekly rerunAddress pass below
  rerunAddress: false  # set true in a separate weekly CronJob to upgrade ZIP→street-level
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# Second-pass per-notice enrichment from state detail pages (currently GA's TCSG
# entry pages; new states register a NoticeEnricher and are picked up here).
# Runs between the scraper and geoBackfill so freshly-added addresses get geocoded
# the same night: scrape (07:17) → enrich-notices (08:15) → backfill-geo (08:47).
noticeEnricher:
  enabled: false          # flip on in HelmRelease
  schedule: "15 8 * * *"  # after scraper 07:17, before geoBackfill 08:47
  requestDelay: 5         # seconds between detail-page requests (TCSG rate-limit safe)
  limit: ""               # blank = all notices missing data; set an int to cap per run
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

migrations:
  enabled: true   # set false only if you manage migrations out-of-band
