{{- if .Values.enricher.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "warn-v2.fullname" . }}-enricher
  labels:
    {{- include "warn-v2.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.enricher.schedule | quote }}
  # Forbid: never overlap runs. Critical when the D&B provider image is used —
  # D&B locks the seat (~1h) on a second concurrent session.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "warn-v2.labels" . | nindent 12 }}
            app.kubernetes.io/component: enricher
        spec:
          restartPolicy: Never
          {{- with .Values.enricher.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: enricher
              image: {{ include "warn-v2.enricherImage" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - enrich
                - --limit
                - {{ .Values.enricher.limit | quote }}
                - --recent-years
                - {{ .Values.enricher.recentYears | quote }}
              env:
                {{- include "warn-v2.envSecrets" . | nindent 16 }}
                {{- if .Values.enricher.providerImage }}
                {{- if .Values.enricher.providerModule }}
                # Usually baked into the provider image's ENV; set here to override.
                - name: ENRICHMENT_PROVIDER_MODULE
                  value: {{ .Values.enricher.providerModule | quote }}
                {{- end }}
                - name: HOOVERS_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.dnb.secretName }}
                      key: {{ .Values.dnb.usernameKey }}
                - name: HOOVERS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.dnb.secretName }}
                      key: {{ .Values.dnb.passwordKey }}
                {{- if .Values.hooversStorage.enabled }}
                - name: HOOVERS_STATE_PATH
                  value: /var/hoovers/profile
                {{- end }}
                {{- if .Values.enricher.maxPerRun }}
                - name: HOOVERS_MAX_PER_RUN
                  value: {{ .Values.enricher.maxPerRun | quote }}
                {{- end }}
                {{- if .Values.enricher.maxPerDay }}
                - name: HOOVERS_MAX_PER_DAY
                  value: {{ .Values.enricher.maxPerDay | quote }}
                {{- end }}
                {{- end }}
              {{- if and .Values.enricher.providerImage .Values.hooversStorage.enabled }}
              volumeMounts:
                - name: hoovers-profile
                  mountPath: /var/hoovers
              {{- end }}
              resources:
                {{- toYaml .Values.enricher.resources | nindent 16 }}
          {{- if and .Values.enricher.providerImage .Values.hooversStorage.enabled }}
          volumes:
            - name: hoovers-profile
              persistentVolumeClaim:
                claimName: {{ include "warn-v2.fullname" . }}-hoovers
          {{- end }}
{{- end }}
