apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "warn-v2.fullname" . }}-scraper
  labels:
    {{- include "warn-v2.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scraper.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # No retry: scrape-all runs every state in one pass, so a Job-level retry
      # re-scrapes all ~47 sources just to re-attempt the one (non-tolerated)
      # state that failed — hammering every healthy source. A transient
      # single-state blip instead recovers on the next daily run; sustained
      # outages surface via the scraper_runs table, not the Job exit code.
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "warn-v2.labels" . | nindent 12 }}
            app.kubernetes.io/component: scraper
        spec:
          restartPolicy: Never
          containers:
            - name: scraper
              image: {{ include "warn-v2.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - scrape-all
                {{- if .Values.scraper.skipStates }}
                - --skip
                - {{ .Values.scraper.skipStates | quote }}
                {{- end }}
                {{- if .Values.scraper.tolerateFailures }}
                - --tolerate
                - {{ .Values.scraper.tolerateFailures | quote }}
                {{- end }}
              env:
                {{- include "warn-v2.envSecrets" . | nindent 16 }}
              volumeMounts:
                - name: snapshots
                  mountPath: /var/snapshots
              resources:
                {{- toYaml .Values.scraper.resources | nindent 16 }}
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: {{ include "warn-v2.fullname" . }}-snapshots
