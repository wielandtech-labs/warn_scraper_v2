{{- if .Values.geoBackfill.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "warn-v2.fullname" . }}-backfill-geo
  labels:
    {{- include "warn-v2.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.geoBackfill.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "warn-v2.labels" . | nindent 12 }}
            app.kubernetes.io/component: backfill-geo
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backfill-geo
              image: {{ include "warn-v2.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - backfill-geo
                {{- if .Values.geoBackfill.rerunAddress }}
                - --rerun-address
                {{- end }}
              env:
                {{- include "warn-v2.envSecrets" . | nindent 16 }}
              resources:
                {{- toYaml .Values.geoBackfill.resources | nindent 16 }}
{{- end }}
